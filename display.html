<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Display · Cronómetros HYROX</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
  html, body {
    overflow: hidden;
    background: var(--bg);
  }

  .top-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    z-index: 10;
    background: linear-gradient(to bottom, rgba(7,8,10,0.9), transparent);
  }

  .event-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: var(--text-dim);
  }

  .event-brand .icon {
    width: 22px;
    height: 22px;
    color: var(--accent);
  }

  .top-bar .status-pill {
    font-size: 14px;
    padding: 8px 16px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
    width: 100vw;
    height: 100vh;
    padding: 74px 10px 10px;
    box-sizing: border-box;
  }

  .timer {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    transition: border-color 0.3s var(--ease-out), background 0.3s var(--ease-out);
  }

  .timer.running {
    border-color: rgba(47, 214, 110, 0.55);
    background: linear-gradient(180deg, rgba(47,214,110,0.06), var(--surface) 55%);
  }

  .timer.maxed {
    border-color: rgba(245, 185, 64, 0.55);
  }

  .run-indicator {
    position: absolute;
    top: 12px;
    right: 12px;
    display: flex;
    align-items: center;
    gap: 5px;
    color: var(--text-faint);
    font-size: clamp(9px, 0.9vw, 12px);
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .run-indicator .icon {
    width: 12px;
    height: 12px;
  }

  .timer.running .run-indicator {
    color: var(--success);
  }

  .label {
    font-size: clamp(13px, 1.6vw, 20px);
    color: var(--text-dim);
    margin-bottom: 6px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .timer.running .label {
    color: var(--success);
  }

  .time {
    font-size: clamp(30px, 5.6vw, 76px);
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }

  .timer.maxed .time {
    color: var(--warning);
  }
</style>
</head>
<body>
  <div class="top-bar">
    <div class="event-brand">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9 3h6"/><path d="M17 4.5l1.5 1.5"/></svg>
      HYROX · Salidas
    </div>
    <div class="status-pill connecting" id="status">
      <span class="dot"></span>
      <span id="statusText">Conectando</span>
    </div>
  </div>
  <div class="grid" id="grid"></div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="assets/firebase-config.js"></script>
  <script>
    // ============================================
    // CONFIGURACIÓN FIREBASE
    // Credenciales reales en assets/firebase-config.js
    // ============================================
    firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.database();
    const cronometrosRef = db.ref('cronometros');

    const MAX_MS = 99 * 60 * 1000 + 59 * 1000;

    // ============================================
    // CREAR UI (20 HITS)
    // ============================================
    const grid = document.getElementById('grid');
    const timers = {};

    const ICON_RUNNING = '<svg class="icon" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8 5v14l11-7z"/></svg>';
    const ICON_STOPPED = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>';

    for (let i = 1; i <= 20; i++) {
      const div = document.createElement('div');
      div.className = 'timer';
      div.id = `timer${i}`;
      div.innerHTML = `
        <div class="run-indicator" id="indicator${i}">${ICON_STOPPED}<span id="indicatorText${i}">Listo</span></div>
        <div class="label">Hit ${i}</div>
        <div class="time mono" id="time${i}">00:00</div>
      `;
      grid.appendChild(div);

      timers[i] = { running: false, startTime: 0, elapsed: 0 };
    }

    // ============================================
    // FORMATO MM:SS (con tope en 99:59)
    // ============================================
    function formatTime(ms) {
      if (ms > MAX_MS) ms = MAX_MS;
      let totalSeconds = Math.floor(ms / 1000);
      let minutes = Math.floor(totalSeconds / 60);
      let seconds = totalSeconds % 60;
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function setRunningVisual(i, running) {
      const timerDiv = document.getElementById(`timer${i}`);
      timerDiv.classList.toggle('running', running);
      document.getElementById(`indicator${i}`).innerHTML = running
        ? `${ICON_RUNNING}<span>En curso</span>`
        : `${ICON_STOPPED}<span>Listo</span>`;
    }

    // ============================================
    // CARGAR DATOS INICIALES
    // ============================================
    async function loadInitialData() {
      const statusEl = document.getElementById('status');
      const statusText = document.getElementById('statusText');
      try {
        const snapshot = await cronometrosRef.get();
        const data = snapshot.val();
        if (!data) throw new Error('No se encontraron datos');

        for (let i = 1; i <= 20; i++) {
          const item = data[i];
          if (!item) continue;
          timers[i] = { running: item.running || false, startTime: item.start_time || 0, elapsed: item.elapsed || 0 };
          setRunningVisual(i, item.running);
        }

        statusEl.className = 'status-pill connected';
        statusText.textContent = 'Conectado';
      } catch (error) {
        console.error('Error cargando datos:', error);
        statusEl.className = 'status-pill error';
        statusText.textContent = error.message;
      }
    }

    // ============================================
    // SUSCRIPCIÓN EN TIEMPO REAL
    // ============================================
    cronometrosRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) return;
      for (let i = 1; i <= 20; i++) {
        const item = data[i];
        if (!item) continue;
        timers[i] = { running: item.running || false, startTime: item.start_time || 0, elapsed: item.elapsed || 0 };
        setRunningVisual(i, item.running);
      }
    });

    // ============================================
    // LOOP DE ACTUALIZACIÓN DE UI
    // ============================================
    setInterval(() => {
      const now = Date.now();

      for (let i = 1; i <= 20; i++) {
        let ms = timers[i].elapsed;
        if (timers[i].running && timers[i].startTime) ms += now - timers[i].startTime;

        const maxed = ms >= MAX_MS;
        if (maxed) ms = MAX_MS;

        document.getElementById('timer' + i).classList.toggle('maxed', maxed);
        document.getElementById('time' + i).textContent = formatTime(ms);
      }
    }, 200);

    // ============================================
    // INICIALIZAR
    // ============================================
    loadInitialData();
  </script>
</body>
</html>
